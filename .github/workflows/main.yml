      - name: Verify Tailscale Secrets
        shell: powershell
        env:
          CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLIENT_ID)) {
            throw "TS_OAUTH_CLIENT_ID is missing"
          }
          if ([string]::IsNullOrWhiteSpace($env:CLIENT_SECRET)) {
            throw "TS_OAUTH_SECRET is missing"
          }
          Write-Host "OAuth secrets detected."

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 525600

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          Write-Host "RDP Enabled successfully."

      - name: Create RDP User with Fixed Password
        run: |
          $password = "Z123456789@#n"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue
          Write-Host "RDP user configured successfully."

      - name: Install and Start Tailscale Natively
        run: |
          Write-Host "Downloading Tailscale installer..."
          curl.exe -L https://pkgs.tailscale.com/stable/tailscale-setup-latest.msi -o tailscale-setup.msi
          
          Write-Host "Installing Tailscale MSI..."
          Start-Process msiexec.exe -ArgumentList '/i tailscale-setup.msi /quiet /norestart' -Wait
          
          Write-Host "Waiting for Tailscale service registration..."
          $serviceName = "Tailscale"
          for ($i = 1; $i -le 15; $i++) {
              if (Get-Service -Name $serviceName -ErrorAction SilentlyContinue) {
                  Write-Host "Tailscale service found!"
                  break
              }
              Write-Host "Waiting 5 seconds for service registration ($i/15)..."
              Start-Sleep -Seconds 5
          }

          Write-Host "Starting Tailscale service..."
          Start-Service -Name $serviceName
          
          Write-Host "Authenticating Tailscale..."
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="tskey-api-kKYCSY143921CNTRL-J2CjFg3cWDefApMdE68VDeoZX2uE9bFd" --hostname=mr-shire --accept-routes
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "Tailscale connected successfully."

      - name: Verify RDP Accessibility
        run: |
          netstat -an | Select-String "3389"
          Write-Host "RDP port is open and listening."

      - name: Maintain Connection + Watch RDP User
        run: |
          while ($true) {
              Start-Sleep -Seconds 30
          }
